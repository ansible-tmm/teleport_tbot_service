[teleport_hosts]
# Teleport-protected hosts must use the full Teleport hostname format:
# {node-name}.{teleport-cluster-domain}
rhel01-nostromo.demoredhat.com.sean-test.teleport.sh ansible_user=ec2-user
ansible-1.example.com.sean-test.teleport.sh ansible_user=ec2-user

[teleport_hosts:vars]
# Route SSH through Teleport's generated ssh_config
# This is set per-group instead of in ansible.cfg so that playbooks like
# install_tbot.yml (which use normal SSH) are not affected
ansible_ssh_common_args=-F /var/lib/teleport-bot/aap-bot/out/sean-test.teleport.sh.ssh_config
