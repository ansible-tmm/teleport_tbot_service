---
- name: Install and Configure Teleport tbot for AAP Execution Nodes
  hosts: all
  become: true
  
  # ============================================================================
  # IMPORTANT: Teleport Prerequisites (One-Time Setup by Teleport Admin)
  # ============================================================================
  #
  # Before running this playbook, a Teleport administrator MUST:
  #
  # 1. Create an SSH access role in Teleport (e.g., "aap-ssh") with:
  #    - SSH login permissions for target hosts
  #    - Appropriate host labels and user mappings
  #
  # 2. The bot role (auto-created as "bot-{bot_name}") must be configured to
  #    allow impersonation of the access role. Example:
  #
  #    kind: role
  #    metadata:
  #      name: bot-aap-bot
  #    spec:
  #      allow:
  #        impersonate:
  #          roles:
  #            - aap-ssh
  #
  # This playbook DOES:
  # - Install Teleport binaries (tbot, tsh, tctl)
  # - Create bot in Teleport
  # - Generate bot join token
  # - Configure tbot.yaml to request the access role
  # - Start tbot as a systemd service
  #
  # This playbook DOES NOT:
  # - Create or modify Teleport roles (done by Teleport admin)
  # - Configure impersonation permissions (done by Teleport admin)
  # - Mount certificates into EEs (done by AAP configuration)
  #
  # ============================================================================
  
  vars:
    # Teleport configuration
    teleport_proxy_addr: "teleport.example.com:443"
    teleport_bot_name: "aap-bot"
    teleport_access_role: "aap-ssh"  # MUST exist in Teleport and allow impersonation
    # teleport_admin_user: MUST be provided as extra var at runtime
    # teleport_admin_password: MUST be provided as extra var at runtime
    # teleport_mfa_token: MUST be provided as extra var at runtime (6-digit code)
    # teleport_ca_pin: Optional, provide via extra var if needed
    teleport_version: "17.1.4"
    teleport_arch: "amd64"

    # System configuration
    tbot_user: "tbot"
    tbot_group: "tbot"

    # Directory structure
    tbot_base_dir: "/var/lib/teleport-bot"
    tbot_data_dir: "/var/lib/teleport-bot/{{ teleport_bot_name }}/data"
    tbot_out_dir: "/var/lib/teleport-bot/{{ teleport_bot_name }}/out"
    tbot_config_dir: "/etc/teleport"
    tbot_config_file: "/etc/teleport/tbot.yaml"
    tbot_temp_dir: "/root/.tsh"

    # Binary paths
    tbot_binary: "/usr/local/bin/tbot"
    tsh_binary: "/usr/local/bin/tsh"
    tctl_binary: "/usr/local/bin/tctl"

  tasks:

    ############################################################################
    # PRE-FLIGHT CHECKS
    ############################################################################

    - name: Verify required variables are defined
      ansible.builtin.assert:
        that:
          - teleport_admin_user is defined
          - teleport_admin_user | length > 0
          - teleport_admin_password is defined
          - teleport_admin_password | length > 0
          - teleport_mfa_token is defined
          - teleport_mfa_token | length > 0
        fail_msg: "teleport_admin_user, teleport_admin_password, and teleport_mfa_token must be provided as extra variables"
        quiet: true
      no_log: true

    - name: Gather service facts
      ansible.builtin.service_facts:

    ############################################################################
    # SYSTEM USER AND GROUP CREATION
    ############################################################################

    - name: Create tbot system group
      ansible.builtin.group:
        name: "{{ tbot_group }}"
        system: true
        state: present
    
    - name: Create tbot system user
      ansible.builtin.user:
        name: "{{ tbot_user }}"
        group: "{{ tbot_group }}"
        system: true
        shell: /sbin/nologin
        home: "{{ tbot_base_dir }}"
        create_home: false
        comment: "Teleport Machine ID Bot Service Account"
        state: present

    ############################################################################
    # DIRECTORY STRUCTURE CREATION
    ############################################################################

    - name: Create base directory for tbot
      ansible.builtin.file:
        path: "{{ tbot_base_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
        setype: var_lib_t

    - name: Create bot-specific data directory
      ansible.builtin.file:
        path: "{{ tbot_data_dir }}"
        state: directory
        owner: "{{ tbot_user }}"
        group: "{{ tbot_group }}"
        mode: '0700'
        setype: var_lib_t
      # This directory holds tbot's internal state and must be writable by tbot user only

    - name: Create bot-specific output directory for certificates
      ansible.builtin.file:
        path: "{{ tbot_out_dir }}"
        state: directory
        owner: "{{ tbot_user }}"
        group: "{{ tbot_group }}"
        mode: '0750'
        setype: var_lib_t
      # Output directory: owned by tbot, group-readable
      # The awx user (or EE runtime) will access this later via group membership or bind mount
      # For now, keeping it tbot:tbot with 0750 for least privilege

    - name: Create Teleport configuration directory
      ansible.builtin.file:
        path: "{{ tbot_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
        setype: etc_t

    ############################################################################
    # TELEPORT INSTALLATION - Tarball Method
    ############################################################################
    
    - name: Check if tbot binary exists in /usr/local/bin
      ansible.builtin.stat:
        path: "{{ tbot_binary }}"
      register: tbot_local_bin_stat
    
    - name: Download Teleport tarball
      ansible.builtin.get_url:
        url: "https://cdn.teleport.dev/teleport-v{{ teleport_version }}-linux-{{ teleport_arch }}-bin.tar.gz"
        dest: "/tmp/teleport-v{{ teleport_version }}.tar.gz"
        mode: '0644'
        timeout: 300
      when: not tbot_local_bin_stat.stat.exists
      register: teleport_download
    
    - name: Extract Teleport tarball
      ansible.builtin.unarchive:
        src: "/tmp/teleport-v{{ teleport_version }}.tar.gz"
        dest: /tmp
        remote_src: true
        creates: "/tmp/teleport/tbot"
      when: not tbot_local_bin_stat.stat.exists
    
    - name: Install Teleport binaries from tarball
      ansible.builtin.copy:
        src: "/tmp/teleport/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        owner: root
        group: root
        mode: '0755'
        remote_src: true
      loop:
        - tbot
        - tsh
        - tctl
      when: not tbot_local_bin_stat.stat.exists
    
    - name: Cleanup temporary files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/teleport-v{{ teleport_version }}.tar.gz"
        - /tmp/teleport
      when: teleport_download is changed

    - name: Verify tbot binary is executable
      ansible.builtin.command:
        cmd: "{{ tbot_binary }} version"
      register: tbot_version_check
      changed_when: false
      failed_when: tbot_version_check.rc != 0

    - name: Display installed tbot version
      ansible.builtin.debug:
        msg: "{{ tbot_version_check.stdout_lines }}"

    ############################################################################
    # TELEPORT ADMIN LOGIN AND BOT TOKEN GENERATION
    ############################################################################
    
    - name: Install pexpect (RPM) for Ansible expect
      ansible.builtin.dnf:
        name: python3-pexpect
        state: present
    
    - name: Clean up any existing tsh sessions
      ansible.builtin.file:
        path: "{{ tbot_temp_dir }}"
        state: absent
    
    - name: Create temporary tsh directory
      ansible.builtin.file:
        path: "{{ tbot_temp_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
    
    - name: Perform Teleport admin login with MFA using expect
      ansible.builtin.expect:
        command: "{{ tsh_binary }} login --proxy={{ teleport_proxy_addr }} --user={{ teleport_admin_user }} --auth=local"
        responses:
          'Enter password for Teleport user': "{{ teleport_admin_password }}"
          'Enter your OTP token': "{{ teleport_mfa_token }}"
          'Enter an OTP code from a': "{{ teleport_mfa_token }}"
        timeout: 60
      register: tsh_login_result
      changed_when: true
      failed_when: tsh_login_result.rc != 0

    - name: Remove existing bot if it exists (idempotent)
      ansible.builtin.command:
        cmd: "{{ tctl_binary }} bots rm {{ teleport_bot_name }}"
      register: bot_remove_result
      failed_when: false
      changed_when: bot_remove_result.rc == 0
    
    - name: Create bot
      ansible.builtin.command:
        cmd: "{{ tctl_binary }} bots add {{ teleport_bot_name }}"
      register: bot_add_result
      changed_when: bot_add_result.rc == 0
      failed_when: bot_add_result.rc != 0
    
    - name: Generate new bot instance token
      ansible.builtin.shell: |
        {{ tctl_binary }} bots instances add {{ teleport_bot_name }} --format=json | jq -r '.token_id'
      register: bot_token_result
      changed_when: true
      failed_when: bot_token_result.rc != 0 or bot_token_result.stdout | length == 0
    
    - name: Set bot join token fact
      ansible.builtin.set_fact:
        teleport_join_token: "{{ bot_token_result.stdout | trim }}"
    
    - name: Verify token was captured
      ansible.builtin.assert:
        that:
          - teleport_join_token is defined
          - teleport_join_token | length > 0
        fail_msg: "Failed to capture bot join token from tctl command"
        quiet: true
      no_log: true

    ############################################################################
    # TELEPORT BOT CONFIGURATION FILE
    ############################################################################
    
    - name: Generate tbot configuration file
      ansible.builtin.copy:
        dest: "{{ tbot_config_file }}"
        owner: root
        group: root
        mode: '0644'
        content: |
          # Teleport Machine ID Bot Configuration
          # Generated by Ansible for {{ inventory_hostname }}
          #
          # How this works:
          # 1. Bot authenticates as bot-{{ teleport_bot_name }} (auto-created by Teleport)
          # 2. Bot requests impersonation of {{ teleport_access_role }} (must exist in Teleport)
          # 3. Teleport issues short-lived SSH certificates for {{ teleport_access_role }}
          # 4. Certificates are written to {{ tbot_out_dir }}
          # 5. AAP mounts this directory into Execution Environments
          #
          # IMPORTANT: The {{ teleport_access_role }} role must exist in Teleport and
          # the bot role must be allowed to impersonate it. This is configured in
          # Teleport RBAC, not in this file.
          #
          version: v2
          
          # Teleport proxy connection
          proxy_server: {{ teleport_proxy_addr if ':' in teleport_proxy_addr else teleport_proxy_addr ~ ':443' }}
          
          # Onboarding configuration - uses join token for machine ID
          onboarding:
            join_method: token
            token: {{ teleport_join_token }}
            {% if teleport_ca_pin is defined and teleport_ca_pin | length > 0 %}
            ca_pins:
              - {{ teleport_ca_pin }}
            {% endif %}
          
          # Storage for bot internal state
          storage:
            type: directory
            path: {{ tbot_data_dir }}
          
          # Output destinations - SSH identity for {{ teleport_access_role }}
          # The bot will impersonate this role to generate SSH certificates
          outputs:
            - type: identity
              destination:
                type: directory
                path: {{ tbot_out_dir }}
              roles:
                - {{ teleport_access_role }}
      no_log: true
      notify: Restart tbot service

    ############################################################################
    # SYSTEMD SERVICE CONFIGURATION
    ############################################################################
    
    - name: Create tbot systemd service unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/tbot.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Teleport Machine ID Bot Service
          Documentation=https://goteleport.com/docs/machine-id/
          After=network-online.target
          Wants=network-online.target
          
          [Service]
          Type=simple
          User={{ tbot_user }}
          Group={{ tbot_group }}
          
          # Start the bot using config file only (no CLI overrides)
          # All settings are in {{ tbot_config_file }}
          ExecStart={{ tbot_binary }} start --config={{ tbot_config_file }}
          
          # Restart policy with exponential backoff
          Restart=on-failure
          RestartSec=5s
          StartLimitInterval=300s
          StartLimitBurst=5
          
          # Logging
          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier=tbot
          
          # Security hardening
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=strict
          ProtectHome=true
          ReadWritePaths={{ tbot_data_dir }} {{ tbot_out_dir }}
          
          [Install]
          WantedBy=multi-user.target
      notify: Restart tbot service

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable tbot service
      ansible.builtin.systemd:
        name: tbot
        enabled: true

    - name: Start tbot service
      ansible.builtin.systemd:
        name: tbot
        state: started
      register: tbot_start

    ############################################################################
    # VERIFICATION AND HEALTH CHECKS
    ############################################################################

    - name: Wait for tbot service to stabilize
      ansible.builtin.pause:
        seconds: 5

    - name: Check tbot service status
      ansible.builtin.systemd:
        name: tbot
      register: tbot_service_status
    
    - name: Retrieve recent tbot logs for troubleshooting
      ansible.builtin.command:
        cmd: journalctl -u tbot -n 50 --no-pager
      register: tbot_logs
      changed_when: false
    
    - name: Display recent tbot logs
      ansible.builtin.debug:
        msg: "{{ tbot_logs.stdout_lines }}"
    
    - name: Verify tbot service is active
      ansible.builtin.assert:
        that:
          - tbot_service_status.status.ActiveState == "active"
        fail_msg: "tbot service is not active. Check logs above for details."
        success_msg: "tbot service is running successfully"

    - name: Wait for identity file to be generated
      ansible.builtin.wait_for:
        path: "{{ tbot_out_dir }}/identity"
        timeout: 60
        state: present
      register: identity_file_check
    
    - name: List generated certificate files
      ansible.builtin.find:
        paths: "{{ tbot_out_dir }}"
        file_type: file
      register: output_files
    
    - name: Display generated files in output directory
      ansible.builtin.debug:
        msg: "Generated certificate files: {{ output_files.files | map(attribute='path') | list }}"
    
    - name: Verify identity file exists
      ansible.builtin.stat:
        path: "{{ tbot_out_dir }}/identity"
      register: identity_stat
      failed_when: not identity_stat.stat.exists
    
    - name: Display identity file info
      ansible.builtin.debug:
        msg: "Identity file: {{ tbot_out_dir }}/identity ({{ identity_stat.stat.size }} bytes)"

    ############################################################################
    # CLEANUP
    ############################################################################

    - name: Clean up Teleport admin session
      ansible.builtin.file:
        path: "{{ tbot_temp_dir }}"
        state: absent
      no_log: true

    - name: Final verification summary
      ansible.builtin.debug:
        msg: |
          ============================================================
          Teleport tbot Installation Complete!
          ============================================================
          Service Status: {{ tbot_service_status.status.ActiveState }}
          Output Directory: {{ tbot_out_dir }}
          Certificate Files: {{ output_files.files | length }} files generated
          Identity File: {{ identity_stat.stat.size }} bytes
          
          Next Steps:
          1. Verify certificates: sudo ls -la {{ tbot_out_dir }}
          2. Check logs: sudo journalctl -u tbot -f
          3. Test SSH access:
             sudo tsh --identity={{ tbot_out_dir }}/identity \
               --proxy={{ teleport_proxy_addr }} \
               ssh user@target-host
          4. Configure AAP to bind-mount {{ tbot_out_dir }} into EEs
          5. Use the identity in Ansible SSH connections
          ============================================================

  handlers:
    - name: Restart tbot service
      ansible.builtin.systemd:
        name: tbot
        state: restarted
        daemon_reload: true
      when: tbot_service_status is defined and tbot_service_status.status.ActiveState == "active"
