[defaults]
# Disable host key checking (Teleport handles host verification)
host_key_checking = False

[ssh_connection]
# Increase timeout for connections through Teleport proxy
timeout = 30

# Enable SSH pipelining for better performance
pipelining = True

# NOTE: ssh_args is NOT set here because this project contains both:
#   - install_tbot.yml (connects via normal SSH to execution nodes)
#   - test_connectivity.yml (connects via Teleport to protected hosts)
#
# Instead, set ansible_ssh_common_args as a host/group variable in your
# inventory so only Teleport hosts get the Teleport SSH config.
# See inventory.ini for an example.
