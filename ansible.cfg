[defaults]
# Use Teleport's SSH configuration for all connections
# This ssh_config file is generated by tbot and contains:
# - ProxyCommand to route through Teleport
# - Certificate-based authentication
# - Known hosts configuration
ssh_args = -F /var/lib/teleport-bot/aap-bot/out/sean-test.teleport.sh.ssh_config

# Disable host key checking (Teleport handles host verification)
host_key_checking = False

# SSH connection settings
[ssh_connection]
# Increase timeout for connections through Teleport proxy
timeout = 30

# Use SSH connection type (not paramiko)
transport = ssh

# Enable SSH pipelining for better performance
pipelining = True
